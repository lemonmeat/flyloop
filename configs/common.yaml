# Settings shared by every experiment config (pulled in by its `defaults` list).
# Each experiment sets `sweep`, the name of its output folder.

index: 0               # sweep_list entry to run, and the run folder name (<index>_<seed>)
seed: 0
out_root: ${oc.env:FLYLOOP_RUNS,runs}
sweep_list: []         # optional: override dicts, one per index (Slurm array task)

hydra:
  run:
    dir: ${out_root}/${sweep}/${index}_${seed}
  output_subdir: .hydra
  job:
    chdir: false

# Activity viewer (flyloop.viz): photoreceptor input and T4/T5 maps of each frame.
# A trial starts at every network reset; trial labels are listed in viz/activity.npz.
viz:
  enabled: false       # record and write <run>/viz/ (activity.npz, trial_<k>.png, activity.mp4)
  trials: null         # null = all; ints = trial indices, strings = parts of trial labels
  batch: [0, 1]        # batch entries shown (VisualRig: 0 = left eye, 1 = right eye)
  every: 1             # keep every n-th frame
  max_frames: 1500     # stop recording after this many frames
  vmax: null           # T4/T5 colour limit; null = 99.5th percentile of |voltage|
  movie: true          # write activity.mp4 (needs the video extra)
  fps: 25
