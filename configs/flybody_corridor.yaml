# Prototype: the flybody (MuJoCo) fly in the corridor, seeing the MuJoCo scene and
# steered by one of the corridor controllers. The flight is held up
# artificially; see flyloop.sim.flybody_body and flyloop.sim.mujoco_world.
# Run: python tasks.py run flybody_corridor [key=value ...]
# Needs the flybody extra: python tasks.py env --extras flybody

defaults:
  - common
  - _self_

sweep: flybody_corridor

model: flow/0000/000
dt: 0.01

eyes:
  axis_azimuth_deg: 80.0
  n_sub: 3

lptc:
  source: connectome
  preset: simple       # LPTC/LPi time constants: simple (10 ms) or literature (3 ms)
  tau_lptc: null       # s; set to override the preset
  tau_lpi: null

corridor:              # as configs/corridor.yaml (width 1)
  pattern: checker
  square: 0.1
  alpha: 1.0
  contrast: 1.0
  length: 8.0
  seed: 1

flybody:
  vision: mujoco       # what the eyes see: mujoco (rendered from the fly's head) or
                       # analytic (the ray-cast Corridor, as configs/corridor.yaml)
  face_px: 128         # pixels along each face of the rendered cube map
  scale_cm: 5.0        # corridor width in cm; fly speed = speed * scale_cm cm/s
  assist: full         # full (autopilot holds speed/height/attitude) or yaw_only
  tau_lin_s: 0.05
  tau_att_s: 0.005
  average_pose: true   # eyes see the pose averaged over each 10 ms frame

speed: 0.5             # corridor widths per s
body_tau_s: 0.05
controller: optomotor  # optomotor, readout, efference or saccade (as configs/corridor.yaml)
calibration: null      # calibration.npz of a corridor run; all but optomotor need it
controllers:           # gains as configs/corridor.yaml
  optomotor: {kp: 5.0, kd: 1.0}
  readout: {kd: 0.5, kc: 150.0, kh: 5.0, ki: 0.0, filter_tau_s: 0.1}
  efference: {kc: 150.0, kh: 3.0, heading: visual, filter_tau_s: 0.5}
  saccade: {amplitude_deg: 20.0, duration_s: 0.05, threshold: 0.1, lookahead_s: 1.0,
            suppress_s: 0.2, filter_tau_s: 0.5, derivative_tau_s: 0.2}
start: [0.15, 10.0]    # lateral offset (widths), heading (deg) when the loop closes
torque_deg_s: 20.0     # constant yaw torque (simulated wing imbalance)
t_run: 5.0
t_settle: 1.0
collision_margin: 0.03

video:
  fps: 25              # playback; frames are 10 ms apart, so 4x slow motion
  height: 480
  width: 640
