# Conda alternative to the default uv environment, for machines where conda is the
# usual way to get Python (e.g. a cluster with an anaconda module):
#   python tasks.py env --conda      (then: conda activate flyloop; python tasks.py models)
# Dependencies are listed once, in pyproject.toml; this file only provides Python.
# torch comes from PyPI: CUDA build on Linux, CPU build on macOS and Windows.
name: flyloop
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - -e .[dev]
